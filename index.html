<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PulseCity</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:radial-gradient(circle at top right,#161d36,#06070a 65%);color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
        
        /* Мини-строка статуса для проверки на телефоне */
        #debugBar{background:#0f172a;color:#00f3ff;font-size:11px;padding:4px 12px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.1);z-index:5000}

        .welcome-screen{position:fixed;inset:0;background:radial-gradient(circle at top,#1b2547,#06070a 75%);z-index:3000;display:none;pointer-events:none;flex-direction:column;align-items:center;justify-content:space-between;padding:48px 24px 36px;text-align:center}
        .welcome-screen.active{display:flex;pointer-events:auto;animation:fadeIn .35s ease}
        .welcome-badge{background:rgba(0,243,255,0.12);border:1px solid rgba(0,243,255,0.3);color:#00f3ff;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:0.5px}
        .welcome-hero{margin:auto 0;max-width:340px}
        .welcome-icon{width:92px;height:92px;margin:0 auto 24px;border-radius:28px;background:linear-gradient(135deg,#00f3ff,#2563eb);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 16px 40px rgba(0,243,255,0.4)}
        .welcome-title{font-size:32px;font-weight:800;margin-bottom:14px;background:linear-gradient(90deg,#ffffff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .welcome-desc{font-size:16px;color:#cbd5e1;line-height:1.5}
        
        header{background:rgba(18,23,38,0.85);backdrop-filter:blur(20px);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);z-index:20}
        .logo{font-size:22px;font-weight:800;background:linear-gradient(90deg,#00f3ff,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header-actions{display:flex;gap:10px;align-items:center}
        .icon-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;position:relative}
        .badge{position:absolute;top:-2px;right:-2px;width:12px;height:12px;background:#ef4444;border-radius:50%;border:2px solid #141829}
        .city-btn{background:rgba(0,243,255,0.15);color:#00f3ff;font-size:14px;font-weight:700;padding:10px 16px;border-radius:18px;border:1px solid rgba(0,243,255,0.35);cursor:pointer;display:flex;align-items:center;gap:6px}
        
        .container{flex:1;overflow-y:auto;padding:20px;padding-bottom:130px}
        .content{display:none;animation:fadeIn .25s ease}
        .content.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        
        .filter-scroll{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px;padding-bottom:6px;scrollbar-width:none}
        .chip{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;padding:10px 18px;border-radius:16px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
        .chip.active{background:linear-gradient(135deg,#00f3ff,#2563eb);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(0,243,255,0.35)}
        
        .btn-main{width:100%;background:linear-gradient(135deg,#00f3ff,#2563eb);color:#fff;border:none;border-radius:20px;padding:18px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 25px rgba(37,99,235,0.45);display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
        
        .card{background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);border-radius:24px;padding:22px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 12px 35px rgba(0,0,0,0.5);position:relative}
        .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .card-tag{display:inline-block;font-size:12px;font-weight:700;text-transform:uppercase;color:#00f3ff;background:rgba(0,243,255,0.12);padding:6px 12px;border-radius:10px}
        .btn-discuss-top{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#00f3ff;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
        
        .card h3{font-size:20px;font-weight:700;margin-bottom:8px;color:#f8fafc}
        .card p{font-size:15px;color:#cbd5e1;line-height:1.5;margin-bottom:16px}
        
        .btn-action{width:100%;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
        .btn-sec{background:rgba(255,255,255,0.08);color:#f1f5f9;border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
        
        .chat-tabs{display:flex;background:rgba(255,255,255,0.06);padding:6px;border-radius:18px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.08)}
        .chat-tab-btn{flex:1;padding:12px;border:none;border-radius:14px;background:transparent;color:#94a3b8;font-size:14px;font-weight:700;cursor:pointer}
        .chat-tab-btn.active{background:linear-gradient(135deg,#00f3ff,#2563eb);color:#fff;box-shadow:0 4px 15px rgba(0,243,255,0.3)}
        
        .chat-box{display:flex;flex-direction:column;gap:14px;margin:14px 0;max-height:45vh;overflow-y:auto;padding-right:4px}
        .msg-row{display:flex;align-items:flex-end;gap:10px;max-width:90%}
        .msg-row.mine{align-self:flex-end;flex-direction:row-reverse}
        .msg-avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0}
        .msg-bubble{background:rgba(255,255,255,0.09);padding:12px 16px;border-radius:18px 18px 18px 6px;font-size:15px;line-height:1.4;word-break:break-word}
        .msg-row.mine .msg-bubble{border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,#00f3ff,#2563eb);color:#fff;font-weight:500}
        .msg-author{font-size:12px;font-weight:700;color:#00f3ff;margin-bottom:4px}
        .msg-row.mine .msg-author{display:none}
        
        .chat-input-area{display:flex;gap:10px;align-items:center}
        .chat-input-area input[type="text"]{flex:1;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:14px;color:#fff;font-size:15px;outline:none;min-width:0}
        .send-btn{background:linear-gradient(135deg,#00f3ff,#2563eb);color:#fff;border:none;border-radius:14px;height:48px;padding:0 20px;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0}
        
        .modal{display:none;pointer-events:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);z-index:2500;align-items:center;justify-content:center;padding:20px}
        .modal.open{display:flex;pointer-events:auto}
        .modal-card{background:#141829;border:1px solid rgba(255,255,255,0.15);border-radius:26px;padding:24px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,0.8)}
        .modal-card h3{font-size:20px;margin-bottom:16px}
        .modal-card input,.modal-card textarea,.modal-card select{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:14px;color:#fff;font-size:15px;margin-bottom:12px;outline:none}
        .modal-card textarea{height:90px;resize:none}
        .city-option{width:100%;text-align:left;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:14px 16px;border-radius:14px;font-size:16px;font-weight:600;margin-bottom:10px;cursor:pointer}
        
        .nav-wrapper{position:fixed;bottom:16px;left:16px;right:16px;z-index:1000}
        nav{background:linear-gradient(180deg,rgba(26,32,54,0.95),rgba(14,18,32,0.99));backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.2);border-radius:30px;display:flex;padding:8px;box-shadow:0 20px 45px rgba(0,0,0,0.85);gap:8px}
        nav button{flex:1;background:rgba(255,255,255,0.03);border:1px solid transparent;border-radius:24px;padding:14px 8px;color:#94a3b8;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
        nav button span.icon{font-size:26px;line-height:1}
        nav button.active{background:linear-gradient(135deg,#00f3ff,#2563eb);color:#fff;border-color:rgba(255,255,255,0.4);box-shadow:0 10px 25px rgba(0,243,255,0.5)}
    </style>
</head>
<body>

<div id="debugBar">Статус: Загрузка...</div>

<div id="welcomeScreen" class="welcome-screen">
    <div class="welcome-badge">ГОРОДСКАЯ ПЛАТФОРМА №1</div>
    <div class="welcome-hero">
        <div class="welcome-icon">⚡</div>
        <h1 class="welcome-title">PulseCity</h1>
        <p class="welcome-desc">Главные новости твоего города, живые чаты с соседями и защищенные личные диалоги.</p>
    </div>
    <button class="btn-main" style="margin-bottom:0;max-width:340px" onclick="goToRegistration()">Начать →</button>
</div>

<header>
    <div class="logo">PulseCity</div>
    <div class="header-actions">
        <button class="icon-btn" onclick="openModal('notifModal')">🔔<span class="badge"></span></button>
        <button class="city-btn" onclick="openModal('cityModal')">📍 <span id="currentCity">Иркутск</span> ▾</button>
    </div>
</header>

<div class="container">
    <div id="tab-feed" class="content active">
        <button class="btn-main" onclick="openModal('newsModal')">✨ Добавить новость</button>
        <div class="filter-scroll">
            <button class="chip active" onclick="filterNews('all',this)">Все</button>
            <button class="chip" onclick="filterNews('emergency',this)">🚨 ЧП</button>
            <button class="chip" onclick="filterNews('events',this)">🎉 События</button>
            <button class="chip" onclick="filterNews('transport',this)">🚗 Транспорт</button>
        </div>
        <div id="newsList"></div>
    </div>

    <div id="tab-chat" class="content">
        <div id="public-chat-view">
            <div class="card">
                <h3 id="chatTitle">Городской чат • Иркутск</h3>
                <div class="chat-box" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="Написать в общий чат...">
                    <button class="send-btn" onclick="sendPublicMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-profile" class="content">
        <div class="card">
            <h3 id="displayProfileName" style="margin-bottom:8px;font-size:20px">Андрей</h3>
            <label style="font-size:13px;color:#94a3b8">Ваш никнейм:</label>
            <input type="text" id="profileNameInput" value="Андрей" oninput="updateProfileName(this.value)" style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:12px;color:#fff;font-size:15px;margin:6px 0 14px">
            <p style="margin-bottom:12px;font-size:15px">Город: <strong id="profileCity" style="color:#00f3ff">Иркутск</strong></p>
            <button class="btn-sec" style="margin-bottom:12px" onclick="openModal('cityModal')">📍 Сменить город</button>
        </div>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-card">
        <h3>📝 Вход в PulseCity</h3>
        <input type="text" id="regNameInput" placeholder="Ваше имя или ник...">
        <button class="btn-main" style="margin:0" onclick="completeRegistration()">Продолжить</button>
    </div>
</div>

<div id="cityModal" class="modal" onclick="if(event.target===this)closeModal('cityModal')">
    <div class="modal-card">
        <h3>Выберите город</h3>
        <button class="city-option" onclick="selectCity('Иркутск')">📍 Иркутск</button>
        <button class="city-option" onclick="selectCity('Новосибирск')">📍 Новосибирск</button>
        <button class="city-option" onclick="selectCity('Москва')">📍 Москва</button>
        <button class="btn-sec" onclick="closeModal('cityModal')">Закрыть</button>
    </div>
</div>

<div id="newsModal" class="modal" onclick="if(event.target===this)closeModal('newsModal')">
    <div class="modal-card">
        <h3>Новая публикация</h3>
        <select id="newsCategorySelect">
            <option value="events">🎉 События</option>
            <option value="emergency">🚨 ЧП</option>
            <option value="transport">🚗 Транспорт</option>
        </select>
        <input type="text" id="newsTitleInput" placeholder="Заголовок новости...">
        <textarea id="newsTextInput" placeholder="Текст новости..."></textarea>
        <div style="display:flex;gap:10px">
            <button class="btn-sec" onclick="closeModal('newsModal')">Отмена</button>
            <button class="btn-main" style="margin:0" onclick="publishNews()">Опубликовать</button>
        </div>
    </div>
</div>

<div id="notifModal" class="modal" onclick="if(event.target===this)closeModal('notifModal')">
    <div class="modal-card">
        <h3>Уведомления</h3>
        <p style="color:#cbd5e1;margin-bottom:14px">Система готова к работе.</p>
        <button class="btn-sec" onclick="closeModal('notifModal')">Закрыть</button>
    </div>
</div>

<div class="nav-wrapper">
    <nav>
        <button class="active" onclick="switchTab('feed',this)"><span class="icon">📰</span><span>Лента</span></button>
        <button id="nav-chat" onclick="switchTab('chat',this)"><span class="icon">💬</span><span>Чаты</span></button>
        <button onclick="switchTab('profile',this)"><span class="icon">👤</span><span>Профиль</span></button>
    </nav>
</div>

<script>
    const bar = document.getElementById('debugBar');
    function logStatus(msg, isErr = false) {
        bar.textContent = msg;
        bar.style.color = isErr ? '#ef4444' : '#10b981';
    }

    window.onerror = function(msg) {
        logStatus('Ошибка JS: ' + msg, true);
    };

    let supabaseClient = null;
    try {
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(
                'https://igmgobjvjovfscjehcuu.supabase.co',
                'Sb_publishable_KDuTo58HYqHaoLt_0m3gNw_J5U1sED8'
            );
            logStatus('База подключена • Кнопки активны');
        } else {
            logStatus('SDK не загружен (проверьте интернет)', true);
        }
    } catch (e) {
        logStatus('Ошибка инициализации: ' + e.message, true);
    }

    let selectedCity = 'Иркутск';
    let myName = localStorage.getItem('pulseCity_v4_name') || 'Андрей';

    document.getElementById('displayProfileName').textContent = myName;
    document.getElementById('profileNameInput').value = myName;

    function openModal(id) {
        document.getElementById(id).classList.add('open');
    }
    function closeModal(id) {
        document.getElementById(id).classList.remove('open');
    }

    function switchTab(t, btn) {
        document.querySelectorAll('.content').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(e => e.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        btn.classList.add('active');
    }

    function selectCity(c) {
        selectedCity = c;
        document.getElementById('currentCity').textContent = c;
        document.getElementById('chatTitle').textContent = 'Городской чат • ' + c;
        document.getElementById('profileCity').textContent = c;
        closeModal('cityModal');
    }

    function updateProfileName(val) {
        myName = val.trim() || 'Гость';
        localStorage.setItem('pulseCity_v4_name', myName);
        document.getElementById('displayProfileName').textContent = myName;
    }

    function filterNews(cat, btn) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('#newsList .card').forEach(c => {
            c.style.display = (cat === 'all' || c.getAttribute('data-category') === cat) ? 'block' : 'none';
        });
    }

    async function loadPostsFromCloud() {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient.from('posts').select('*').order('id', { ascending: false });
        if (error) {
            logStatus('Ошибка чтения постов: ' + error.message, true);
            return;
        }
        const list = document.getElementById('newsList');
        list.innerHTML = '';
        if (!data || data.length === 0) {
            list.innerHTML = '<div class="card"><p style="margin:0;text-align:center;color:#94a3b8">Пока нет новостей. Нажмите «Добавить новость» сверху!</p></div>';
            return;
        }
        data.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-category', p.category);
            card.innerHTML = `
                <div class="card-top">
                    <span class="card-tag">${p.city}</span>
                    <button class="btn-discuss-top" onclick="switchTab('chat',document.getElementById('nav-chat'))">💬 Чат</button>
                </div>
                <h3>${p.title}</h3>
                <p>${p.content}</p>
            `;
            list.appendChild(card);
        });
    }

    async function publishNews() {
        const title = document.getElementById('newsTitleInput').value.trim();
        const text = document.getElementById('newsTextInput').value.trim();
        const cat = document.getElementById('newsCategorySelect').value;
        if (!title || !text) { alert('Введите заголовок и текст!'); return; }

        logStatus('Отправка новости в базу...');
        const { error } = await supabaseClient.from('posts').insert([{
            city: selectedCity,
            category: cat,
            title: title,
            content: text
        }]);

        if (error) {
            logStatus('Ошибка записи: ' + error.message, true);
            alert('Ошибка базы данных: ' + error.message);
            return;
        }

        logStatus('Новость опубликована!');
        document.getElementById('newsTitleInput').value = '';
        document.getElementById('newsTextInput').value = '';
        closeModal('newsModal');
        loadPostsFromCloud();
    }

    async function loadPublicMessages() {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient.from('messages').select('*').eq('chat_type', 'public').order('id', { ascending: true });
        if (error) return;
        const box = document.getElementById('chatMessages');
        box.innerHTML = '';
        (data || []).forEach(m => {
            const row = document.createElement('div');
            row.className = 'msg-row' + (m.sender === myName ? ' mine' : '');
            row.innerHTML = `<div class="msg-avatar">${m.sender[0].toUpperCase()}</div><div class="msg-bubble"><div class="msg-author">${m.sender}</div>${m.text}</div>`;
            box.appendChild(row);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function sendPublicMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const { error } = await supabaseClient.from('messages').insert([{
            chat_type: 'public',
            sender: myName,
            text: text
        }]);

        if (error) {
            logStatus('Ошибка чата: ' + error.message, true);
            return;
        }
        input.value = '';
        loadPublicMessages();
    }

    loadPostsFromCloud();
    loadPublicMessages();
</script>
</body>
</html>
