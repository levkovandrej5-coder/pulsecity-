<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Локальный пульс | Киберпанк Менеджер</title>
    <!-- Подключаем Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран авторизации / Входа -->
    <div id="auth-screen" class="screen active">
        <div class="cyber-card">
            <h1 class="glitch-title">ЛОКАЛЬНЫЙ ПУЛЬС</h1>
            <p class="subtitle">СЕТЕВОЙ УЗЕЛ v1.0.4</p>
            <input type="email" id="email-input" placeholder="Введите ваш ID (Email)..." class="cyber-input">
            <button id="login-btn" class="cyber-btn">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <!-- Основной экран приложения -->
    <div id="main-screen" class="screen">
        <!-- Шапка -->
        <header class="cyber-header">
            <span class="pulse-status">● СЕТЬ АКТИВНА</span>
            <span id="user-id-display" class="user-tag"></span>
        </header>

        <!-- Контент вкладок -->
        <div class="content-container">
            <!-- Вкладка 1: Лента новостей -->
            <div id="feed-tab" class="tab-content active">
                <div class="cyber-card post-creator">
                    <h3>НОВЫЙ СИГНАЛ В ЛЕНТУ</h3>
                    <textarea id="post-content" placeholder="Опишите обстановку в секторе..." class="cyber-textarea"></textarea>
                    <button id="send-post-btn" class="cyber-btn small">ТРАНСЛИРОВАТЬ</button>
                </div>
                <div id="posts-feed" class="feed-list">
                    <!-- Посты будут подгружаться сюда -->
                </div>
            </div>

            <!-- Вкладка 2: Чаты / Мессенджер -->
            <div id="chats-tab" class="tab-content">
                <div id="chat-window" class="cyber-card chat-box">
                    <div id="messages-list" class="messages-list">
                        <!-- Сообщения чата -->
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="message-input" placeholder="Сообщение в общий канал..." class="cyber-input">
                        <button id="send-msg-btn" class="cyber-btn small">SEND</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Нижняя навигационная панель -->
        <nav class="cyber-nav">
            <button class="nav-btn active" data-tab="feed">ЛЕНТА</button>
            <button class="nav-btn" data-tab="chats">КАНАЛЫ</button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
