name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Web & Package
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
          
          echo '{
            "appId": "com.pulsecity.app",
            "appName": "PulseCity",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

          npm install
          npx @capacitor/cli copy android

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-files
          path: www/
